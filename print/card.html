<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* 70 x 170 mm, portrait. Every dimension in mm, because this is a physical object —
   a card laid out in px only lands at the right size if a DPI assumption happens to
   hold, and it never does across a home inkjet and a print shop. */
@page { size: 70mm 170mm; margin: 0; }

* { margin: 0; padding: 0; box-sizing: border-box; }

html, body { width: 70mm; height: 170mm; }

body {
  /* Without this the background wash is dropped by the print pipeline. Harmless on
     a white card, kept because the wash is part of the design. */
  -webkit-print-color-adjust: exact;
  print-color-adjust: exact;
  font-family: Inter, -apple-system, "Segoe UI", Roboto, sans-serif;
  background: #ffffff;
  color: #22222e;
  overflow: hidden;
  position: relative;
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  grid-template-rows: 1fr auto 1fr;
  justify-items: center;
  padding: 13mm 8mm 12mm;
}

/* Warm wash behind the wordmark. Low contrast on purpose: heavy colour on a small
   card reads as cheap, and it costs ink. */
body::before {
  content: "";
  position: absolute;
  left: 50%;
  top: -40mm;
  transform: translateX(-50%);
  width: 96mm;
  height: 96mm;
  background: radial-gradient(circle, rgba(255,107,0,0.11) 0%, rgba(255,107,0,0) 62%);
}

/* Top group: brand and copy, pinned to the top of its row so the space it does not
   use falls between it and the code rather than above it. */
.top {
  align-self: start;
  display: flex;
  flex-direction: column;
  align-items: center;
}

/* ── brand ─────────────────────────────────────────────────────── */
.brand {
  position: relative;
  display: flex;
  align-items: center;
  gap: 3mm;
}
.brand svg { width: 11mm; height: 11mm; display: block; }
.brand-name {
  font-size: 7.6mm;
  font-weight: 800;
  letter-spacing: -0.025em;
  line-height: 1;
  color: #0a0a0f;
  white-space: nowrap;
}

.headline {
  position: relative;
  margin-top: 7mm;
  font-size: 4.2mm;
  font-weight: 600;
  line-height: 1.4;
  letter-spacing: -0.01em;
  text-align: center;
  text-wrap: balance;
  max-width: 52mm;
  color: #22222e;
}
/* Darker than the site's #ff8c38: that tone is tuned for a dark ground and is too
   light to read as body text on white. */
.subhead {
  position: relative;
  margin-bottom: 0.6mm;
  font-size: 3.6mm;
  font-weight: 700;
  line-height: 1.35;
  letter-spacing: -0.005em;
  text-align: center;
  text-wrap: balance;
  max-width: 50mm;
  color: #d95a00;
}

/* ── the code ──────────────────────────────────────────────────── */
/* The centred grid row holds ONLY the code, so what lands on the card's midline is
   the code and not the code-plus-caption pair. */
.qr-tile { align-self: center; display: block; }

/* Bottom row: caption at the top of it, footer pinned to the bottom. */
.below {
  align-self: stretch;
  justify-self: stretch;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  align-items: center;
}

/* No tile and no padding: the page is already white, so the paper IS the quiet zone.
   A 47mm code centred on a 70mm card leaves 11.5mm of white each side — over 7
   modules against the spec's 4 — and verify-render.py measures that from the
   rendered pixels on all four edges, so it is asserted rather than assumed. */
.qr-tile svg {
  /* 47mm across 29 modules is 1.62mm per module — a third more than the landscape
     card managed, because a 70mm-wide portrait card has room the 170mm-wide one
     spent on text. More module width is more tolerance for ink spread. */
  width: 47mm;
  height: 47mm;
  display: block;
  fill: #0a0a0f;
}
.scan {
  margin-top: 7mm;
  max-width: 40mm;
  line-height: 1.45;
  text-wrap: balance;
  font-size: 3.1mm;
  font-weight: 700;
  letter-spacing: 0.07em;
  text-transform: uppercase;
  text-align: center;
  color: #6b6b80;
}

/* ── footer ────────────────────────────────────────────────────── */
.foot {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 1.8mm;
  text-align: center;
}

/* The URL in text as well as in the code. A card whose only route to the site is a
   scan that fails — bad light, no camera permission, a cracked lens — is a dead
   end, and this costs one line. */
.url {
  font-size: 4.1mm;
  font-weight: 700;
  letter-spacing: -0.01em;
  color: #d95a00;
  white-space: nowrap;
}
.place {
  font-size: 3mm;
  font-weight: 500;
  letter-spacing: 0.015em;
  color: #6b6b80;
}

/* Hairline rule above the footer, in the brand orange. */
.foot::before {
  content: "";
  position: absolute;
  top: -6mm;
  left: 50%;
  transform: translateX(-50%);
  width: 26mm;
  height: 0.35mm;
  background: linear-gradient(90deg, rgba(255,107,0,0) 0%, rgba(255,107,0,0.6) 50%, rgba(255,107,0,0) 100%);
}
</style>
</head>
<body>

<div class="top">
<div class="brand">
  <svg viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
    <rect width="32" height="32" rx="8" fill="url(#g)"/>
    <path d="M8 22V14l8-6 8 6v8M13 22v-5h6v5" stroke="#fff" stroke-width="1.8"
          stroke-linecap="round" stroke-linejoin="round"/>
    <defs><linearGradient id="g" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ff6b00"/><stop offset="1" stop-color="#ff8c38"/>
    </linearGradient></defs>
  </svg>
  <div class="brand-name">3D-Prints</div>
</div>

<div class="headline">3D printed décor, figurines and gifts</div>
</div>

<div class="qr-tile"><!--QR--></div>

<div class="below">
  <div class="scan">Scan to browse all collections</div>
  <div class="foot">
  <div class="subhead">Made to order in Pondicherry</div>
  <div class="url">3d-prints.aswincloud.com</div>
    <div class="place">Order online · Shipped India-wide</div>
  </div>
</div>

</body>
</html>
