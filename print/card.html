<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* 70 x 155 mm, portrait. Every dimension in mm, because this is a physical object —
   a card laid out in px only lands at the right size if a DPI assumption happens to
   hold, and it never does across a home inkjet and a print shop. */
@page { size: 70mm 155mm; margin: 0; }

* { margin: 0; padding: 0; box-sizing: border-box; }

html, body { width: 70mm; height: 155mm; }

body {
  /* Without this the background wash is dropped by the print pipeline. Harmless on
     a white card, kept because the wash is part of the design. */
  -webkit-print-color-adjust: exact;
  print-color-adjust: exact;
  font-family: Inter, -apple-system, "Segoe UI", Roboto, sans-serif;
  background: #ffffff;
  color: #22222e;
  overflow: hidden;
  position: relative;
  padding: 0 8mm;
}

/* Warm wash behind the wordmark. Low contrast on purpose: heavy colour on a small
   card reads as cheap, and it costs ink. */
body::before {
  content: "";
  position: absolute;
  left: 50%;
  top: -40mm;
  transform: translateX(-50%);
  width: 96mm;
  height: 96mm;
  background: radial-gradient(circle, rgba(255,107,0,0.11) 0%, rgba(255,107,0,0) 62%);
}

/* Top group, pinned to the top edge. */
.top {
  position: absolute;
  top: 11mm;
  left: 8mm;
  right: 8mm;
  display: flex;
  flex-direction: column;
  align-items: center;
}

/* ── brand ─────────────────────────────────────────────────────── */
.brand {
  position: relative;
  display: flex;
  align-items: center;
  gap: 3mm;
}
.brand svg { width: 11mm; height: 11mm; display: block; }
.brand-name {
  font-size: 7.6mm;
  font-weight: 800;
  letter-spacing: -0.025em;
  line-height: 1;
  color: #0a0a0f;
  white-space: nowrap;
}

.headline {
  position: relative;
  margin-top: 7mm;
  font-size: 4.2mm;
  font-weight: 600;
  line-height: 1.4;
  letter-spacing: -0.01em;
  text-align: center;
  text-wrap: balance;
  max-width: 52mm;
  color: #22222e;
}
/* Darker than the site's #ff8c38: that tone is tuned for a dark ground and is too
   light to read as body text on white. */
.subhead {
  position: relative;
  margin-bottom: 0.6mm;
  font-size: 3.6mm;
  font-weight: 700;
  line-height: 1.35;
  letter-spacing: -0.005em;
  text-align: center;
  text-wrap: balance;
  max-width: 50mm;
  color: #d95a00;
}

/* ── the code ──────────────────────────────────────────────────── */
/* Dead centre by definition, not as an outcome of row arithmetic. */
.qr-tile {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  display: block;
}

/* Caption sits a fixed distance under the code: half the code (23.5mm) plus the
   7mm quiet-zone clearance. Derived rather than eyeballed, so changing the code
   size moves it correctly. */
.below {
  position: absolute;
  top: calc(50% + 23.5mm + 7mm);
  left: 8mm;
  right: 8mm;
  display: flex;
  flex-direction: column;
  align-items: center;
}

/* No tile and no padding: the page is already white, so the paper IS the quiet zone.
   A 47mm code centred on a 70mm card leaves 11.5mm of white each side — over 7
   modules against the spec's 4 — and verify-render.py measures that from the
   rendered pixels on all four edges, so it is asserted rather than assumed. */
.qr-tile svg {
  /* 47mm across 29 modules is 1.62mm per module — a third more than the landscape
     card managed, because a 70mm-wide portrait card has room the 170mm-wide one
     spent on text. More module width is more tolerance for ink spread. */
  width: 47mm;
  height: 47mm;
  display: block;
  fill: #0a0a0f;
}
.scan {
  max-width: 40mm;
  line-height: 1.45;
  text-wrap: balance;
  font-size: 3.1mm;
  font-weight: 700;
  letter-spacing: 0.07em;
  text-transform: uppercase;
  text-align: center;
  color: #6b6b80;
}

/* ── footer ────────────────────────────────────────────────────── */
/* Pinned to the bottom edge, so the whitespace above it absorbs the height change. */
.foot {
  position: absolute;
  bottom: 11mm;
  left: 8mm;
  right: 8mm;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 1.8mm;
  text-align: center;
}

/* The URL in text as well as in the code. A card whose only route to the site is a
   scan that fails — bad light, no camera permission, a cracked lens — is a dead
   end, and this costs one line. */
.url {
  font-size: 4.1mm;
  font-weight: 700;
  letter-spacing: -0.01em;
  color: #d95a00;
  white-space: nowrap;
}
.place {
  font-size: 3mm;
  font-weight: 500;
  letter-spacing: 0.015em;
  color: #6b6b80;
}

</style>
</head>
<body>

<div class="top">
<div class="brand">
  <svg viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
    <rect width="32" height="32" rx="8" fill="url(#g)"/>
    <path d="M8 22V14l8-6 8 6v8M13 22v-5h6v5" stroke="#fff" stroke-width="1.8"
          stroke-linecap="round" stroke-linejoin="round"/>
    <defs><linearGradient id="g" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ff6b00"/><stop offset="1" stop-color="#ff8c38"/>
    </linearGradient></defs>
  </svg>
  <div class="brand-name">3D-Prints</div>
</div>

<div class="headline">3D printed décor, figurines and gifts</div>
</div>

<div class="qr-tile"><!--QR--></div>

<div class="below">
  <div class="scan">Scan to browse all collections</div>
</div>

<div class="foot">
  <div class="subhead">Made to order in Pondicherry</div>
  <div class="url">3d-prints.aswincloud.com</div>
  <div class="place">Order online · Shipped India-wide</div>
</div>

</body>
</html>
