<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sign in — AswinPrints</title>
<meta name="description" content="Sign in to AswinPrints to see your orders and cart." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="assets/css/style.css" />
<link rel="stylesheet" href="assets/css/admin.css" />
</head>
<body class="admin-body">

<header class="admin-nav">
  <a href="/" class="nav-logo">
    <svg viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg" width="28" height="28">
      <rect width="32" height="32" rx="8" fill="url(#ng)"/>
      <path d="M8 22V14l8-6 8 6v8M13 22v-5h6v5" stroke="white" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      <defs><linearGradient id="ng" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
        <stop stop-color="#ff6b00"/><stop offset="1" stop-color="#ff8c38"/>
      </linearGradient></defs>
    </svg>
    <span>AswinPrints</span>
  </a>
  <div class="admin-nav-right">
    <a href="/" class="admin-link">← Back to shop</a>
  </div>
</header>

<section class="admin-signin">
  <div class="signin-card">

    <!-- Step 1: email -->
    <div id="stepEmail">
      <h1>Sign in</h1>
      <p class="signin-sub">We'll email you a 6-digit code. No password to remember.</p>
      <form id="emailForm" novalidate>
        <div class="co-field" style="text-align:left">
          <label for="loginEmail">Email address</label>
          <input type="email" id="loginEmail" name="login_email" autocomplete="email"
                 inputmode="email" placeholder="you@example.com" required />
          <span class="field-error" id="login_emailError"></span>
        </div>
        <button type="submit" class="btn-primary co-submit" id="sendBtn">
          <span id="sendLabel">Email me a code</span>
        </button>
      </form>
    </div>

    <!-- Step 2: code -->
    <div id="stepCode" hidden>
      <h1>Check your email</h1>
      <p class="signin-sub">
        We sent a 6-digit code to <strong id="sentTo"></strong>.
        It expires in <span id="ttlMins">10</span> minutes.
      </p>
      <form id="codeForm" novalidate>
        <div class="co-field" style="text-align:left">
          <label for="loginCode">6-digit code</label>
          <input type="text" id="loginCode" name="login_code" inputmode="numeric"
                 autocomplete="one-time-code" maxlength="6" placeholder="123456"
                 style="letter-spacing:6px;font-size:1.2rem;text-align:center" required />
          <span class="field-error" id="login_codeError"></span>
        </div>
        <button type="submit" class="btn-primary co-submit" id="verifyBtn">
          <span id="verifyLabel">Sign in</span>
        </button>
      </form>
      <p class="cart-fineprint" style="margin-top:1rem">
        <button type="button" class="admin-btn-ghost" id="resendBtn">Resend code</button>
        <button type="button" class="admin-btn-ghost" id="changeEmailBtn">Use another email</button>
      </p>
    </div>

    <div class="admin-alert admin-alert-err" id="loginError" hidden></div>
    <div class="admin-alert admin-alert-ok" id="loginOk" hidden></div>
  </div>
</section>

<script src="assets/js/login.js"></script>
</body>
</html>
