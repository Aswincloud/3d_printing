# Must match the Worker that Workers Builds created, which took its name from
# the repo (3d_printing → 3d-printing). A mismatch here would deploy a SECOND
# Worker rather than updating the live one.
name = "3d-printing"
main = "src/index.js"
compatibility_date = "2026-07-01"

# Static site served from ./public; Worker handles /api/* (non-asset paths).
[assets]
directory = "./public"
binding = "ASSETS"
# With [assets] + main, a request matching a static file is served DIRECTLY by
# the asset server and the Worker's fetch handler never runs — so the security
# headers added in src/security.js reached the JSON API but not a single HTML
# page, which is exactly where the CSP has to be. Verified: /api/health carried
# the headers, / did not.
#
# Scoped to the HTML entry points rather than `true`, because worker-first on
# every asset would put a Worker invocation in front of all 78 static files
# (images, css, js) and forfeit the edge cache on them. These two paths are the
# only ones that need the CSP, since they are the only documents that execute
# script. Extend this list when another HTML page is added.
run_worker_first = [
  "/", "/index.html", "/shop", "/shop.html",
  # The five policy pages Razorpay requires. They load chat.js, so they need the
  # same CSP as every other document — without an entry here the asset server
  # answers them directly and they ship with no security headers at all, which is
  # exactly the bug this list was created to fix.
  "/terms", "/terms.html", "/privacy", "/privacy.html",
  "/refunds", "/refunds.html", "/shipping", "/shipping.html",
  "/contact", "/contact.html",
  # The local landing page. Same reason as the policy pages: it loads chat.js and
  # needs the CSP, and the extensionless /3d-printing-in-pondicherry form only
  # resolves through the Worker.
  "/3d-printing-in-pondicherry", "/3d-printing-in-pondicherry.html",
  # Search-engine routes. Generated by the Worker from D1 — there is no file for
  # either, so without an entry here the asset server answers first and returns
  # 404, and the Worker's route never runs. Deployed without these and the
  # sitemap 404'd on production while working under `wrangler dev`, which is
  # more permissive about this list.
  "/sitemap.xml", "/robots.txt",
]

# Workers Cache. Without this, Cache-Control and CDN-Cache-Control on a Worker
# response are INERT — Cloudflare does not cache Worker output by default, and
# no cf-cache-status header appears at all. Confirmed against production: the
# homepage sent s-maxage=60 and was still executing the Worker on every request.
#
# Needed because the homepage now runs a D1 query to render the catalogue into
# the HTML for crawlers, which took TTFB from ~6ms to ~12ms. With this, the edge
# serves the rendered page and the origin runs that query once a minute rather
# than once per visitor.
#
# Zone-level Cache Rules have no effect on Workers; this setting is the switch.
[cache]
enabled = true

[[d1_databases]]
binding = "DB"
database_name = "3dprints-db"
database_id = "f553c677-81a3-4d47-a012-9179ddfceb63"

# Rate limiting. Counted at the edge, keyed on CF-Connecting-IP (see
# src/security.js). `period` accepts only 10 or 60 — not arbitrary windows — so
# the limits below are expressed per-minute.
#
# namespace_id must be unique per limiter and is just an opaque number; reusing
# one across two limiters would silently pool their counters together.
#
# These are per-IP, so they bound one abusive client, not aggregate load. A
# distributed attacker with many IPs is still only limited by Cloudflare's
# volumetric DDoS protection at the edge — which is a different control, and one
# we get for free.

# Each call creates a real Razorpay order, so this is the expensive one.
[[ratelimits]]
name = "RL_ORDER"
namespace_id = "3001"
  [ratelimits.simple]
  limit = 12
  period = 60

# Sends two emails per call via Resend.
[[ratelimits]]
name = "RL_QUOTE"
namespace_id = "3002"
  [ratelimits.simple]
  limit = 6
  period = 60

# Unauthenticated sign-in surface: code request, resend and verify.
[[ratelimits]]
name = "RL_AUTH"
namespace_id = "3003"
  [ratelimits.simple]
  limit = 10
  period = 60

# Coupon validation. Unauthenticated and it reveals whether a code is real, so
# without this it is a code-guessing oracle. 15/min is generous for a human
# retyping a code from an Instagram caption and useless for enumeration.
[[ratelimits]]
name = "RL_COUPON"
namespace_id = "3004"
  [ratelimits.simple]
  limit = 15
  period = 60

# Mints a discount code, so it costs real money to abuse. Only the bot container
# calls it, which means this is keyed on effectively one IP — it bounds an
# attacker who has the secret, not visitors. The per-visitor limit is in
# issueChatCoupon(). 30/min is far above the bot's real rate.
[[ratelimits]]
name = "RL_CHATCOUPON"
namespace_id = "3005"
  [ratelimits.simple]
  limit = 30
  period = 60

[vars]
APP_NAME = "AswinPrints"
APP_BASE_URL = "https://3d-prints.aswincloud.com"
RESEND_FROM_EMAIL = "noreply@aswincloud.com"
OWNER_EMAIL = "aswin@aswincloud.com"
ACCESS_MODE = "owners"
FLAT_SHIP_PAISE = "9900"
FREE_SHIP_THRESHOLD_PAISE = "200000"

# Kill switch for chat-issued discount codes. Set to "false" and deploy to stop
# the promo immediately — no bot rebuild, no Chatwoot change. The endpoint 503s
# and writes nothing. The terms themselves (10%, ₹300 cap, 30 min) are constants
# in src/chatcoupons.js, deliberately NOT vars: the fewer inputs that decide what
# a discount is worth, the fewer things can move it.
CHAT_COUPONS_ENABLED = "true"
# The coupon featured in the homepage banner. A var, not code, so featuring a
# different one is an edit here — and clearing it takes the banner down without
# touching the coupon, which stays usable for anyone who already has it.
PROMO_CODE = "WELCOME10"

# Google Search Console HTML-file verification. Paste the token from the
# verification file's NAME (google<TOKEN>.html) — not the whole filename — and
# deploy. Empty means the route is inert.
GOOGLE_SITE_VERIFICATION = ""

# Invoicing. On payment the shop asks invoicer.aswincloud.com to raise a real
# invoice and email it to the customer — a document with a number, distinct from
# the "Order confirmed" receipt the shop sends itself.
#
# Kill switch: "false" + deploy stops it. Worth having on the payment path, even
# though sendOrderInvoice() already swallows every failure.
INVOICE_ENABLED = "true"
INVOICER_URL = "https://invoicer.aswincloud.com"

# Secrets (NOT here — set via `wrangler secret put`, never committed):
#   RESEND_API_KEY
#   RAZORPAY_KEY_ID, RAZORPAY_KEY_SECRET, RAZORPAY_WEBHOOK_SECRET
#   SESSION_SECRET, RELAY_SECRET, AUTH_BROKER_URL
#   CHAT_BOT_SECRET   — shared with the Chatwoot bot container; signs
#                       POST /api/chat/coupon. Must match the value in
#                       /home/aswin/chatwoot/offhours-bot/secrets.env.
#   SHOP_INGEST_SECRET — shared with the Invoicer Worker; signs the invoice
#                       request. Must match the secret of the same name on
#                       invoicer.aswincloud.com.
